  let current = DEFAULT;
  // 系統語言 → 支援的語言。中文一律用繁體，其他一律英文
  function detect(locale) {
    const l = String(locale || '').toLowerCase();
    return l.startsWith('zh') ? 'zh-TW' : 'en';
  }
  const valid = code => LANGS.some(x => x.code === code);
  function setLang(code) { current = valid(code) ? code : DEFAULT; return current; }
  const getLang = () => current;
  // 取文字：缺的鍵退回繁體中文；{name} 換成參數
  function t(key, params, lang) {
    const dict = MESSAGES[lang || current] || {};
    let s = dict[key];
    if (s == null) s = MESSAGES[DEFAULT][key];
    if (s == null) return key;
    return params ? s.replace(/\{(\w+)\}/g, (m, k) => (params[k] == null ? m : params[k])) : s;
  }
  // 同一個鍵在所有語言的樣子（比對「這是不是預設文字」用，不受語言切換影響）
  const all = key => Object.keys(MESSAGES).map(l => MESSAGES[l][key]).filter(x => x != null);
  return { LANGS, DEFAULT, MESSAGES, detect, valid, setLang, getLang, t, all };

<body style="margin:0">
<meta name="claude:viewport-fit-sides" content="cover">
<title>AI 任務闖關地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：固定 1440×900 的舞台（海上三座島：走過的、現在的、被霧蓋住的終點），整體等比縮放塞進視窗 */
:root {
  color-scheme: light;
  --sea: #cfe6ec;
  --page: #b9d6de;
  --ink: #1b2530;
  --ink-soft: #4a5562;
  --panel: #ffffff;
  --line: #c9d2da;
  --todo-edge: #8f99a5;
  --doing: #1f6feb;
  --wait: #c2540a;
  --wait-bg: #fff0e0;
  --done: #1a7f45;
  --adjust: #f2c230;
  --adjust-ink: #3b2f00;
  --adjust-bg: #fff7d6;
  --cancel: #7d8590;
  --road: #ecdcb4;
  --road-edge: #c9b584;
  --robot: #6b4ee6;
  --font: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --move: .8s cubic-bezier(.65, 0, .35, 1);
}
html, body { height: 100%; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow-x: hidden;
}
.fit { position: relative; flex: none; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(20, 50, 70, .25); }
.stage { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; background: var(--sea); overflow: hidden; font-size: 15px; line-height: 1.5; }
.stage * { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #111; outline-offset: 3px; }
svg.map { position: absolute; inset: 0; z-index: 1; }

/* 示範切換列 */
.demo { position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 24px; background: rgba(255, 255, 255, .92); border-bottom: 1px solid var(--line); }

};

const base = { round: 6, world: '報名表單森林', goal: '做出報名表單', pastWorlds: PAST, finalGoal: '上線城堡', waitingFor: null, choice: null, toast: null };
const SCENARIOS = {
  normal: { ...base,

    levels: [lv('f1', 'done'), lv('f2', 'done'),
      lv('f3', 'adjust', { reason: '暫停：因為你說「報名資料我想改存到 Google 試算表」，等你決定怎麼走' }),
      lv('f4', 'todo'), lv('f5', 'todo')] },
  finish: { ...base, userSaid: '幫我做報名表單，報名成功後要寄確認信', aiSays: '這個世界全部通關！報名表單做好了。',
    levels: [lv('f1', 'done'), lv('f2', 'done'), lv('f3', 'done'), lv('f4', 'done'), lv('f5', 'done')] },
  small: { ...base, round: 1, world: '把按鈕改紅色', goal: '把送出按鈕改成紅色', pastWorlds: [], finalGoal: '任務完成',
    userSaid: '把送出按鈕改成紅色', aiSays: '在「把按鈕改紅色」這關：正在修改 style.css…', activity: { text: '正在修改 style.css' },
    levels: [{ id: 'solo1', title: '把按鈕改紅色', status: 'doing', plain: '把送出按鈕的顏色改成紅色，讓人更容易看到', tech: '修改 style.css 按鈕背景色',
      steps: [{ title: '找到按鈕', done: true }, { title: '改顏色', done: false }], touched: [{ verb: '改了', name: 'index.html' }] }] },
  change: { ...base,

    toast: '地圖更新！拆掉 1 關，開了 1 條新路',
    levels: [lv('f1', 'done'), lv('f2', 'done'), lv('f3', 'done'),
      lv('f4', 'cancel', { reason: '已拆除：你說「確認信不要了，改成傳 LINE 通知我就好」' }),
      { id: 'fl', title: 'LINE 通知', status: 'doing', isNew: true, plain: '有人報名成功，就傳一則 LINE 訊息給你。', tech: 'LINE Messaging API', reason: '新關卡：取代原本的「寄確認信」，因為你說「改成傳 LINE 通知我就好」' },
      lv('f5', 'todo')] }
};

/* ---------- 座標：預先排好的插槽 ---------- */
const WORLD_POS = [{ x: 90, y: 478 }, { x: 190, y: 588 }, { x: 305, y: 688 }];
const FINAL = { x: 1250, y: 250 };
let finalOn = false;   // 全部完成了嗎（通往城堡的路要不要變綠）
const SLOTS = {};
for (let n = 1; n <= 8; n++) {
  SLOTS[n] = Array.from({ length: n }, (_, i) => {
    const t = n === 1 ? .5 : i / (n - 1);
    return { x: Math.round(440 + t * 530), y: Math.round(610 - t * 90 + (i % 2 ? -30 : 30)) };
  });
}
function layout(plan) {
  const active = plan.levels.filter(l => l.status !== 'cancel');
  const slots = SLOTS[Math.min(Math.max(active.length, 1), 8)];
  const pos = {};
  active.forEach((l, i) => { pos[l.id] = slots[Math.min(i, slots.length - 1)]; });
  plan.levels.forEach((l, i) => {
    if (l.status !== 'cancel') return;
    const prev = plan.levels.slice(0, i).reverse().find(x => x.status !== 'cancel');
    const next = plan.levels.slice(i + 1).find(x => x.status !== 'cancel');
    const a = prev ? pos[prev.id] : next ? pos[next.id] : slots[0];
    const b = next ? pos[next.id] : a;
    const origin = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    pos[l.id] = { x: origin.x, y: origin.y + 135, origin };
  });
  return pos;
}

/* ---------- 道路（貝茲曲線串接） ---------- */
function segs(P) {
  return P.slice(0, -1).map((p, i) => {
    const p0 = P[i - 1] || p, p1 = P[i + 1], p2 = P[i + 2] || p1;
    return `C${p.x + (p1.x - p0.x) / 6} ${p.y + (p1.y - p0.y) / 6} ${p1.x - (p2.x - p.x) / 6} ${p1.y - (p2.y - p.y) / 6} ${p1.x} ${p1.y}`;
  });
}
function drawRoads(plan, pos) {
  const active = plan.levels.filter(l => l.status !== 'cancel');
  const P = [...roadStart, ...active.map(l => pos[l.id])];
  const s = segs(P), head = `M${P[0].x} ${P[0].y}`;
  const full = head + s.join('');
  let reach = -1;
  active.forEach((l, i) => { if (l.status !== 'todo') reach = i; });
  $('rEdge').setAttribute('d', full);
  $('rBase').setAttribute('d', full);
  $('rDash').setAttribute('d', full);
  $('rDone').setAttribute('d', head + s.slice(0, roadStart.length + reach).join(''));
  const last = P[P.length - 1];
  $('rFinal').setAttribute('d', `M${last.x} ${last.y - 20} Q${(last.x + FINAL.x) / 2 + 30} ${last.y - 90} ${FINAL.x - 50} ${FINAL.y + 60}`);
  $('rFinal').setAttribute('stroke', finalOn ? '#35a862' : '#7d8590');
  $('rFinal').setAttribute('stroke-width', finalOn ? '14' : '5');
  $('rFinal').setAttribute('stroke-dasharray', finalOn ? 'none' : '4 14');
  // 已拆除：斷掉的虛線連回原位置（中間留一段缺口）
  let c = '';
  plan.levels.filter(l => l.status === 'cancel').forEach(l => {
    const p = pos[l.id], o = p.origin; if (!o) return;
    const at = t => `${p.x + (o.x - p.x) * t} ${p.y - 30 + (o.y - p.y + 30) * t}`;
    c += `M${at(0)}L${at(.38)}M${at(.62)}L${at(1)}`;
  });
  $('rCancel').setAttribute('d', c);
}

/* ---------- 狀態 ---------- */
let openedTimer = 0, roadStart = WORLD_POS, follow = true, plan = null, prev = null, selected = null, shown = {}, raf = 0, toastTimer = 0;
const els = new Map();
const put = (el, p) => { el.style.transform = `translate(${p.x}px, ${p.y}px)`; };
const robotLevel = p => ['wait', 'doing', 'adjust'].map(s => p.levels.find(l => l.status === s)).find(Boolean)
  || [...p.levels].reverse().find(l => l.status === 'done') || p.levels.find(l => l.status !== 'cancel') || p.levels[0];
// 關卡太多時，只畫角色附近的幾關
function windowed(p, robotAt) {
  const act = p.levels.filter(l => l.status !== 'cancel');
  if (act.length <= MAXV) return { levels: p.levels, before: 0, after: 0 };
  const r = Math.max(act.indexOf(robotAt), 0);
  const start = Math.min(Math.max(r - 3, 0), act.length - MAXV);
  const vis = new Set(act.slice(start, start + MAXV));
  let lastAct = null;
  const levels = p.levels.filter(l => {
    if (l.status !== 'cancel') { lastAct = l; return vis.has(l); }
    return vis.has(lastAct || act[0]);
  });
  return { levels, before: start, after: act.length - start - MAXV };
}
const signText = (p, l) => (p.choice && robotLevel(p) === l) ? T('ui.tagPause') : T('ui.tagSign');

function render(next, opts = {}) {
  prev = plan; plan = next;
  const first = !prev;
  const active = plan.levels.filter(l => l.status !== 'cancel');
  const robotAt = robotLevel(plan);
  const view = windowed(plan, robotAt);
  const pos = layout(view);
  roadStart = WORLD_POS.slice(-Math.max(Math.min(plan.pastWorlds.length, WORLD_POS.length), 1));
  const viewActive = view.levels.filter(l => l.status !== 'cancel');
  if (opts.resetSelection || !view.levels.some(l => l.id === selected)) follow = true;
  if (follow) selected = robotAt.id;
  $('moreBefore').hidden = !view.before; $('moreBefore').textContent = T('ui.before', { n: view.before });
  $('moreAfter').hidden = !view.after; $('moreAfter').textContent = T('ui.after', { n: view.after });

  // 比對新舊計畫
  const old = new Map((prev ? prev.levels : []).map(l => [l.id, l]));
  const diff = { added: 0, cancelled: 0, rework: 0 };
  plan.levels.forEach(l => {
    const o = old.get(l.id);
    if (!o) { if (!first) diff.added++; return; }
    if (l.status === 'cancel' && o.status !== 'cancel') diff.cancelled++;
    if (l.status === 'adjust' && o.status === 'done') diff.rework++;
  });

  // 關卡元素：新增的彈出來，其餘滑到新位置
  const keep = new Set(view.levels.map(l => l.id));
  els.forEach((el, id) => { if (!keep.has(id)) { el.style.opacity = 0; setTimeout(() => el.remove(), 400); els.delete(id); delete shown[id]; } });
  view.levels.forEach(l => {
    let el = els.get(l.id);
    if (!el) {
      el = document.createElement('button');
      el.type = 'button';
      el.innerHTML = '<span class="lv-in"></span>';
      el.addEventListener('click', () => { selected = l.id; follow = l.id === robotLevel(plan).id; markSelected(); renderCard(); });
      put(el, pos[l.id]);
      if (!first) el.classList.add('pop');
      $('levels').appendChild(el);
      els.set(l.id, el);
    } else { el.classList.remove('pop'); }
    const num = active.indexOf(l) + 1;
    el.className = `level ${l.status}${el.classList.contains('pop') ? ' pop' : ''}`;
    el.setAttribute('aria-label', (num ? T('ui.levelAria', { num, title: l.title, status: STATUS[l.status] }) : T('ui.levelAria0', { title: l.title, status: STATUS[l.status] })));
    const low = viewActive.indexOf(l) % 2 === 0 ? ' low' : '';   // 位置偏低的關卡，牌子掛下面才不會擋到鄰居
    const tag = l.status === 'adjust' ? `<span class="tag sign${low}">${signText(plan, l)}</span>` : l.isNew ? `<span class="tag new${low}">${esc(T('ui.tagNew'))}</span>` : '';
    const face = (l.status === 'todo' || l.status === 'doing') ? num : ICON[l.status];
    el.firstChild.innerHTML = `${tag}<span class="disc">${face}</span><span class="name">${esc(l.title)}</span>`;
    requestAnimationFrame(() => put(el, pos[l.id]));
  });
  markSelected();

  // 角色與泡泡用走的
  // 全部關卡（含使用者中途加的分支）都通關：機器人走到城堡大門前，城堡解鎖
  const complete = active.length > 0 && active.every(l => l.status === 'done');
  finalOn = complete;
  const stand = complete ? { x: FINAL.x, y: FINAL.y + 72 } : pos[robotAt.id];
  put($('robot'), stand);
  put($('bubble'), { x: stand.x, y: stand.y - 132 });
  $('bubble').classList.toggle('far', complete);
  $('castle').classList.toggle('on', complete);
  $('islandFinal').classList.toggle('on', complete);
  document.querySelectorAll('.cloud').forEach(c => c.classList.toggle('gone', complete));
  document.querySelector('.final').classList.toggle('on', complete);
  $('finalLock').innerHTML = complete ? ICON.flag + esc(T('ui.finished')) : ICON.wait + esc(T('ui.locked'));
  renderBubble();
  $('robot').className = (complete ? 'far ' : '') + (active.some(l => l.status === 'wait') ? 'wait'
    : active.length && active.every(l => l.status === 'done') ? 'happy'
    : active.some(l => l.status === 'doing' || l.status === 'adjust') ? 'work' : 'sleep');
  $('stage').classList.toggle('waiting', plan.levels.some(l => l.status === 'wait'));

  // 道路跟著關卡一起滑
  cancelAnimationFrame(raf);
  const from = {};
  Object.keys(pos).forEach(id => { from[id] = shown[id] || pos[id]; });
  const t0 = performance.now(), dur = (first || reduced) ? 0 : 800;
  const step = now => {
    const t = dur ? Math.min((now - t0) / dur, 1) : 1;
    const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const cur = {};
    Object.keys(pos).forEach(id => {
      const a = from[id], b = pos[id];
      cur[id] = { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e, origin: b.origin };
    });
    shown = cur;
    drawRoads(view, cur);
    if (t < 1) raf = requestAnimationFrame(step);
  };
  step(t0);

  // 固定資訊
  const done = active.filter(l => l.status === 'done').length;
  const at = Math.max(active.indexOf(robotAt), 0) + 1;
  $('whereName').textContent = T('ui.world', { n: plan.round, name: plan.world });
  $('whereGoal').textContent = T('ui.goal', { goal: plan.goal });
  $('barFill').style.width = (active.length ? done / active.length * 100 : 0) + '%';
  $('barBox').setAttribute('aria-valuemax', active.length);
  $('barBox').setAttribute('aria-valuenow', done);
  $('cntNow').textContent = `${at} / ${active.length}`;
  $('cntDone').textContent = T('ui.doneCount', { n: done });
  $('saidLabel').textContent = plan.source === 'chat' ? T('ui.task') : T('ui.said');
  $('saidText').textContent = T('ui.quote', { s: plan.userSaid });
  $('finalName').textContent = plan.finalGoal;
  renderWorlds();
  renderHistory();
  renderSessions(plan);
  renderCard();

  // 只有結構改變才通知
  let msg = plan.toast;
  if (msg === undefined && (diff.added || diff.cancelled || diff.rework)) {
    msg = T('toast.prefix') + [diff.added && T('toast.added', { n: diff.added }), diff.cancelled && T('toast.cancelled', { n: diff.cancelled }), diff.rework && T('toast.rework', { n: diff.rework })].filter(Boolean).join(T('sep.toast'));
  }
  if (msg && !opts.quiet) showToast(msg); else hideToast();
}

function markSelected() { els.forEach((el, id) => el.classList.toggle('sel', id === selected)); }

// 等了多久。Claude Code 沒有「你按了同意」的事件，所以工具跑很久時橘色會一直在，這行字讓人知道是不是卡住了
function waitAgeText(since) {
  if (!since) return '';
  const sec = Math.max(0, Math.floor((Date.now() - since) / 1000)), m = Math.floor(sec / 60);
  const base = m < 1 ? T('ui.waitJust') : T('ui.waitMin', { m });
  return sec >= 120 ? T('ui.waitLong', { base }) : base;
}
setInterval(() => { const el = $('waitAge'); if (el && plan && plan.waitSince) el.textContent = waitAgeText(plan.waitSince); }, 15000);

function renderBubble() {
  const b = $('bub');
  if (plan.waitingFor) {
    b.className = 'bub wait';
    b.innerHTML = `<div class="head">${ICON.wait}${esc(T(plan.waitKind === 'user' ? 'ui.userHead' : 'ui.waitHead'))}</div><p>${esc(plan.waitingFor)}</p><p class="waitage" id="waitAge">${esc(plan.waitKind === 'user' ? T('ui.userHint') : waitAgeText(plan.waitSince))}</p>${pet ? '' : '<div class="acts"><button type="button" id="keyBtn">我貼好了，交出鑰匙</button></div>'}`;
    if (!pet) $('keyBtn').addEventListener('click', () => {
      render({ ...plan, waitingFor: null, toast: null, aiSays: '收到鑰匙了！門打開，繼續前進。',
        levels: plan.levels.map(l => l.status === 'wait' ? { ...l, status: 'doing', reason: '門已打開：你交出了鑰匙' } : l) }, { quiet: true });
    });
  } else if (plan.choice) {
    b.className = 'bub choice';
    b.innerHTML = `<p>${esc(plan.aiSays)}<br><b>${esc(plan.choice.question)}</b></p><div class="acts">${plan.choice.options.map((o, i) => `<button type="button" data-opt="${i}">${esc(o)}</button>`).join('')}</div>`;
    b.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => choose(+btn.dataset.opt)));
  } else {
    b.className = 'bub';
    b.innerHTML = `<p>${esc(plan.aiSays)}</p>`;
  }
}
function choose(i) {
  const cur = robotLevel(plan);
  const finish = i === 0;
  render({ ...plan, choice: null, toast: null,
    aiSays: finish ? `好，我先把「${cur.title}」打完，下一關再照你說的改路線。` : `好，現在改路線！「${cur.title}」這關我回頭重做，照你說的來。`,
    levels: plan.levels.map(l => l !== cur ? l : finish
      ? { ...l, status: 'doing', reason: `你選了「${plan.choice.options[0]}」：這關照原計畫打完，再處理你說的「${plan.userSaid}」` }
      : { ...l, status: 'adjust', reason: `回頭修：你選了「${plan.choice.options[1]}」，因為你說「${plan.userSaid}」` }) }, { quiet: true });
}

function renderCard() {
  const l = plan.levels.find(x => x.id === selected); if (!l) return;
  const num = plan.levels.filter(x => x.status !== 'cancel').indexOf(l) + 1;
  const working = (l.status === 'doing' || l.status === 'adjust') && plan.activity;
  const tl = l.touched || [];
  const nowHtml = working ? `<p class="now">${ICON.doing}<span>${esc(T('ui.nowLine', { when: plan.activity.done ? T('ui.nowJust') : T('ui.nowNow'), text: plan.activity.text }))}</span></p>` : '';
  const touchedHtml = tl.length ? `<div class="tlabel">${esc(T('ui.touched'))}</div><ul class="steps">${tl.slice(0, 6).map(t => `<li class="ch">${ICON.adjust}<span>${esc(T('ui.fileLine', { verb: t.verb, name: t.name }))}</span></li>`).join('')}${tl.length > 6 ? `<li><span>${esc(T('ui.moreFiles', { n: tl.length - 6 }))}</span></li>` : ''}</ul>` : '';
  $('card').innerHTML = `
    <div class="card-top"><span class="pill ${l.status}">${ICON[l.status]}${esc(l.user && l.status === 'wait' ? T('status.user') : STATUS[l.status])}</span><span class="eyebrow">${esc(num ? T('ui.cardNum', { n: num }) : T('ui.offRoad'))}</span></div>
    <h2>${esc(l.title)}</h2>
    <p>${esc(l.plain)}</p>
    ${nowHtml}${touchedHtml}
    ${l.status === 'wait' && plan.waitingFor ? `<p class="why wait"><b>${esc(T('ui.whyWait'))}</b>${esc(plan.waitingFor)}</p>` : ''}
    ${l.steps && l.steps.length ? `<ul class="steps">${l.steps.map(st => `<li class="${st.done ? 'ok' : ''}">${st.done ? ICON.done : ICON.todo}<span>${esc(st.title)}</span></li>`).join('')}</ul>` : ''}
    ${l.reason && !(l.user && l.status === 'wait') ? `<p class="why"><b>${esc(T('ui.whyChanged'))}</b>${esc(l.reason)}</p>` : ''}
    <p class="tech"><span>${esc(T('ui.tech'))}</span>${esc(l.tech)}</p>`;
}

function renderSessions(p) {
  const box = $('sessions'), list = p.sessions || [];
  if (list.length < 2) { box.hidden = true; box.innerHTML = ''; return; }
  const af = document.activeElement, focusId = af && af.classList && af.classList.contains('srow') ? af.dataset.id : null;
  box.hidden = false;
  box.innerHTML = `<div class="eyebrow">${esc(T('ui.sessions', { n: list.length }))}</div><div class="slist">${list.map(x => {
    const icon = x.waiting ? ICON.wait : (x.total && x.done === x.total) ? ICON.done : x.mood === 'work' ? ICON.doing : ICON.todo;
    const pct = x.total ? Math.round(x.done / x.total * 100) : 0;
    return `<button type="button" class="srow${x.id === p.selected ? ' sel' : ''}${x.waiting ? ' w' : ''}" data-id="${esc(x.id)}" aria-pressed="${x.id === p.selected}" aria-label="${esc(T('ui.sAria', { name: x.name, state: x.waiting ? T('ui.sAriaWait') : T('ui.sAriaProg', { done: x.done, total: x.total }) }))}">
      <span class="sic">${icon}</span><span class="snm">${esc(x.name)}</span><span class="sbar"><i style="width:${pct}%"></i></span><span class="scnt">${x.waiting ? esc(T('ui.sWaiting')) : `${x.done}/${x.total}`}</span></button>`;
  }).join('')}</div>`;
  if (focusId) { const el = [...box.querySelectorAll('.srow')].find(b => b.dataset.id === focusId); if (el) el.focus(); }
}
$('sessions').addEventListener('click', e => {
  const b = e.target.closest('.srow'); if (!b) return;
  if (pet) pet.select(b.dataset.id); else demoSelect(b.dataset.id);
});

/* ---------- 已完成的世界：主畫面放最近 3 個，更早的往左看（每張 3 個） ---------- */
const PER = WORLD_POS.length;
let histPage = 0;   // 0＝主畫面；1 起是更早的幾張
const pastN = () => (plan ? plan.pastWorlds.length : 0);
const maxPage = () => Math.ceil(Math.max(pastN() - PER, 0) / PER);
function histRange(page) { const end = pastN() - PER - PER * (page - 1); return [Math.max(end - PER, 0), end]; }
function renderHistory() {
  if (histPage > maxPage()) histPage = maxPage();
  const on = histPage > 0;
  $('navOlder').hidden = on || pastN() <= PER;
  $('navOlder').setAttribute('aria-label', T('ui.older'));
  $('history').hidden = !on;
  if (!on) return;
  const [a, b] = histRange(histPage);
  const base = plan.round - pastN();   // 第一個已完成世界的編號
  $('histTitle').textContent = T('ui.histTitle', { a: base + a, b: base + b - 1 });
  $('histRow').innerHTML = plan.pastWorlds.slice(a, b).map((w, i) => `<div class="hcard"><div class="disc">${ICON.flag}</div><h3>${esc(T('ui.world', { n: base + a + i, name: w.name }))}</h3><ul>${String(w.summary || '').split(/[、，,]/).filter(x => x.trim()).map(x => `<li>${ICON.done}<span>${esc(x.trim())}</span></li>`).join('')}</ul></div>`).join('');
  $('histOlder').hidden = a <= 0;
  $('histOlder').setAttribute('aria-label', T('ui.older')); $('histNewer').setAttribute('aria-label', T('ui.newer')); $('histBack').textContent = T('ui.histBack');
  $('histPage').textContent = T('ui.histPage', { p: histPage, m: maxPage() });
}
$('navOlder').innerHTML = svg('<path d="M15 5l-7 7 7 7"/>');
$('histOlder').innerHTML = svg('<path d="M15 5l-7 7 7 7"/>');
$('histNewer').innerHTML = svg('<path d="M9 5l7 7-7 7"/>');
$('navOlder').addEventListener('click', () => { histPage = 1; renderHistory(); });
$('histOlder').addEventListener('click', () => { histPage = Math.min(histPage + 1, maxPage()); renderHistory(); });
$('histNewer').addEventListener('click', () => { histPage = Math.max(histPage - 1, 0); renderHistory(); });
$('histBack').addEventListener('click', () => { histPage = 0; renderHistory(); });

function renderWorlds() {
  const box = $('worlds');
  if (box.dataset.key === JSON.stringify(plan.pastWorlds)) return;
  box.dataset.key = JSON.stringify(plan.pastWorlds);
  box.innerHTML = '';
  plan.pastWorlds.slice(-WORLD_POS.length).forEach((w, i, arr) => {
    const n = plan.round - arr.length + i;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'world';
    b.setAttribute('aria-label', T('ui.worldLabel', { n, name: w.name }));
    b.innerHTML = `<span class="disc">${ICON.flag}</span><span class="name">${esc(T('ui.world', { n, name: w.name }))}</span>`;
    const wp = WORLD_POS[WORLD_POS.length - arr.length + i];
    put(b, wp);
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      const pop = $('worldpop');
      if (!pop.hidden && pop.dataset.w === String(i)) { pop.hidden = true; return; }
      pop.dataset.w = i;
      pop.style.left = wp.x + 'px'; pop.style.top = (wp.y - 52) + 'px';
      pop.innerHTML = `<h3>${esc(T('ui.worldPassed', { n, name: w.name }))}</h3><ul>${w.summary.split(/[、，,]/).map(s => `<li>${ICON.done}<span>${esc(s.trim())}</span></li>`).join('')}</ul>`;
      pop.hidden = false;
    });
    box.appendChild(b);
  });
}
document.addEventListener('click', () => { $('worldpop').hidden = true; });

function showToast(msg) {
  const t = $('toast');
  t.innerHTML = ICON.bell + esc(msg);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { clearTimeout(toastTimer); $('toast').classList.remove('show'); }

/* ---------- 裝飾：樹 ---------- */
$('trees').innerHTML = [[395, 470, 1], [505, 345, 1], [660, 318, 1], [870, 335, 1], [1040, 430, 1], [1075, 610, 1], [610, 752, 1], [930, 720, 1], [700, 440, 1],
  [60, 520, 0], [200, 500, 0], [330, 790, 0], [40, 720, 0]].map(([x, y, live]) =>
  `<g transform="translate(${x} ${y})" opacity="${live ? 1 : .55}"><rect x="-3" y="6" width="6" height="14" rx="2" fill="#8a6a45"/><circle cx="0" cy="-2" r="15" fill="${live ? '#4fae5f' : '#8fb58c'}"/><circle cx="-9" cy="5" r="10" fill="${live ? '#5fbd6c' : '#9cc099'}"/><circle cx="9" cy="5" r="10" fill="${live ? '#43a054' : '#86ad83'}"/></g>`).join('');
$('finalLock').innerHTML = ICON.wait + T('ui.locked');

/* ---------- 示範切換 ---------- */
// 示範版的第二個對話（blog），讓清單與切換看得到
const DEMO_BLOG = { ...base, round: 1, world: '部落格草稿島', goal: '寫完第一篇文章', pastWorlds: [], finalGoal: '發布文章',
  userSaid: '幫我把第一篇文章的草稿寫完', aiSays: '我正在打「寫結尾」這關，打完就往下一關！',
  levels: [lv('f1', 'done', { title: '列出文章大綱' }), lv('f2', 'done', { title: '寫開頭' }), lv('f3', 'done', { title: '寫中段' }), lv('f4', 'doing', { title: '寫結尾' })] };
const sumOf = p => {
  const act = p.levels.filter(l => l.status !== 'cancel'), done = act.filter(l => l.status === 'done').length;
  return { done, total: act.length, waiting: act.some(l => l.status === 'wait'), mood: act.some(l => l.status === 'doing' || l.status === 'adjust') ? 'work' : 'sleep' };
};
let demoClub = null, demoSel = 'club';
function demoShow(opts) {
  const p = structuredClone(demoSel === 'blog' ? DEMO_BLOG : demoClub);
  p.sessions = [{ id: 'club', name: 'club-signup', ...sumOf(demoClub) }, { id: 'blog', name: 'blog', ...sumOf(DEMO_BLOG) }];
  p.selected = demoSel;
  render(p, opts);
}
function demoSelect(id) { demoSel = id; demoShow({ resetSelection: true, quiet: true }); }
document.querySelectorAll('.demo button[data-sc]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.demo button[data-sc]').forEach(x => x.setAttribute('aria-pressed', x === b));
  demoClub = structuredClone(SCENARIOS[b.dataset.sc]); demoSel = 'club';
  demoShow({ resetSelection: true });
}));

/* ---------- 等比縮放 ---------- */
function fit() {
  const s = pet ? Math.min(innerWidth / 1440, innerHeight / 900) : Math.min((innerWidth - 32) / 1440, (innerHeight - 32) / 900, 1.6);
  const k = Math.max(s, .2);
  $('fit').style.width = 1440 * k + 'px'; $('fit').style.height = 900 * k + 'px';
  $('stage').style.transform = `scale(${k})`;
}
addEventListener('resize', fit); fit();

if (pet) {
  document.documentElement.classList.add('live'); fit();
  $('btnClose').innerHTML = ICON.cancel;
  $('btnMini').addEventListener('click', () => pet.minimize());
  $('btnClose').addEventListener('click', () => pet.close());
  pet.onPlan(p => { $('subTitle').textContent = p.project ? (p.source === 'chat' ? p.project : `Claude Code・${p.project}`) : T('ui.connecting'); render(p); });
  pet.onOpened(o => {
    $('openedText').textContent = o.text; $('openedHint').textContent = o.hint;
    $('openedClose').textContent = T('ui.dismiss'); $('opened').hidden = false;
    clearTimeout(openedTimer); openedTimer = setTimeout(() => { $('opened').hidden = true; }, 12000);
  });
  $('openedClose').addEventListener('click', () => { $('opened').hidden = true; });
  pet.ready();
} else {
  demoClub = structuredClone(SCENARIOS.normal); demoShow();
}
applyStatic();
$('langSel').addEventListener('change', e => {
  const v = e.target.value;
  if (pet) { pet.setLang(v); return; }   // 桌面程式：主程式存起來並重新載入畫面
  langSetting = v; store.set(v); LANG = I.valid(v) ? v : I.detect(navigator.language);
  applyStatic(); $('worlds').dataset.key = ''; if (plan) render(plan, { quiet: true });
});
/* 之後接上真正的 AI：把每次回覆最後的 JSON 丟進來就會更新地圖 */
window.QuestMap = { update: p => render(p, { resetSelection: true }), scenarios: SCENARIOS };
})();
</script>
